daemon off;
pid /home/exedev/xearch/.local-hosting/nginx.pid;
error_log /home/exedev/xearch/.local-hosting/logs/error.log warn;

events {}

http {
  access_log /home/exedev/xearch/.local-hosting/logs/access.log;
  client_body_temp_path /home/exedev/xearch/.local-hosting/tmp/client;
  proxy_temp_path /home/exedev/xearch/.local-hosting/tmp/proxy;
  fastcgi_temp_path /home/exedev/xearch/.local-hosting/tmp/fastcgi;
  uwsgi_temp_path /home/exedev/xearch/.local-hosting/tmp/uwsgi;
  scgi_temp_path /home/exedev/xearch/.local-hosting/tmp/scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /home/exedev/xearch/dist;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
      try_files $uri =404;
      expires 1h;
      add_header Cache-Control "public";
    }
  }

  # Public edge for the search service. The binary refuses a non-loopback
  # bind, so this is the only way in; the bearer token is the auth boundary.
  server {
    listen 4321;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 16k;

    location / {
      proxy_pass http://127.0.0.1:4320;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 35s;
    }
  }
}
