daemon off;
pid /home/exedev/xearch/.local-hosting/nginx.pid;
error_log /home/exedev/xearch/.local-hosting/logs/error.log warn;

events {}

http {
  access_log /home/exedev/xearch/.local-hosting/logs/access.log;
  client_body_temp_path /home/exedev/xearch/.local-hosting/tmp/client;
  proxy_temp_path /home/exedev/xearch/.local-hosting/tmp/proxy;
  fastcgi_temp_path /home/exedev/xearch/.local-hosting/tmp/fastcgi;
  uwsgi_temp_path /home/exedev/xearch/.local-hosting/tmp/uwsgi;
  scgi_temp_path /home/exedev/xearch/.local-hosting/tmp/scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 8080;
    server_name _;
    root /home/exedev/xearch/dist;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico|woff2?)$ {
      try_files $uri =404;
      expires 1h;
      add_header Cache-Control "public";
    }
  }
}
